services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      # Main API keys
      - BINANCE_API_KEY=${BINANCE_API_KEY:-testkey}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-testsecret}
      # Testnet API keys (copied from main keys for convenience)
      - BINANCE_TESTNET_API_KEY=${BINANCE_API_KEY:-testkey}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_API_SECRET:-testsecret}
      # Set to production mode for live environment
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      # Set testnet to false for production
      - TESTNET=False
      - USE_TESTNET=False
      # CORS settings
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://frontend,*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trading-network

  # Frontend React application
  frontend:
    build:
      context: ./binance-trading-dashboard
      dockerfile: Dockerfile
    container_name: trading-bot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge